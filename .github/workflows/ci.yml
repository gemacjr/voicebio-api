# Build and test on every push to main and every pull request.
#
# What runs (./mvnw -Pprod verify, the same command as locally):
#   enforcer (JDK 21) -> spotless:check (google-java-format) -> compile + protoc
#   -> unit tests -> integration tests, incl. Karate against mocked MBTA APIs (no network)
#   -> checkstyle (nohttp) -> modernizer
# Then the container image is built with Jib (to a tarball, not pushed) to prove it still builds.
#
# Live tests against the real MBTA APIs (KarateLiveIT, Bruno, Gatling) are NOT run here:
# they depend on a third-party service and its rate limit (20 requests/minute without a key).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'bruno/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', 'bruno/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-commit-id (prod profile) reads the history

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, check formatting, run unit and integration tests
        run: ./mvnw -B -ntp -Pprod verify

      - name: Build container image (not pushed)
        run: ./mvnw -B -ntp -Pprod jib:buildTar -Djib-maven-plugin.architecture=amd64

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/karate-reports/
          retention-days: 14
          if-no-files-found: ignore
