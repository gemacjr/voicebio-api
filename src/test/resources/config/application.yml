# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

spring:
  application:
    name: voicebioApi
  jackson:
    datatype:
      datetime:
        write-durations-as-timestamps: false
  main:
    allow-bean-definition-overriding: true
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: voicebio-api-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: voicebio-api-scheduling-
      pool:
        size: 20

server:
  port: 10344
  address: localhost

# ===================================================================
# Application specific properties (bound to the ApplicationProperties class)
# ===================================================================
application:
  security:
    jwt:
      # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
      base64-secret: OWYyYTg5MDcwMDM5MTAyOWZhMDAzNjQ4MGUzZjc1YTYwOThmZGJlOGE0ZTYzNTE1N2E1NDUyM2IyYTBkMzBhMzRkNTY3ZjZhMDg0YzFkZmFjMjFjNjNiNzNhODRhM2NkMmRiNDhmMTA5ZWI0YzRjOGFlNTA3YWU3OWM4ZWM4Zjg=

management:
  # This file replaces src/main/resources/config/application.yml in tests, so the
  # "exporters off by default" settings must be repeated here.
  datadog:
    metrics:
      export:
        enabled: false
  dynatrace:
    metrics:
      export:
        enabled: false

