// Public contract of GET /api/transit/vehicles: what this API promises its callers.
//
// Deliberately separate from gtfs-realtime.proto (the upstream feed format): callers depend on this
// small, stable shape, and changes to the upstream feed stay inside TransitService's mapping.
//
// Evolution rules (protobuf compatibility):
//   - never change or reuse a field number; reserve removed ones
//   - only add fields; new fields must be optional to readers
//   - enum value 0 is always the "unspecified" default
syntax = "proto3";

package voicebio.transit.v1;

import "google/protobuf/timestamp.proto";

option java_package = "com.example.api.transit.v1";
option java_multiple_files = true;
option java_outer_classname = "TransitProto";

// Where a vehicle is relative to its current stop.
enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  INCOMING_AT = 1;
  STOPPED_AT = 2;
  IN_TRANSIT_TO = 3;
}

// One vehicle's latest known position.
message Vehicle {
  string vehicle_id = 1;
  string label = 2;                          // e.g. train or bus number shown to riders
  string route_id = 3;                       // e.g. "Red", "39"
  string trip_id = 4;
  double latitude = 5;
  double longitude = 6;
  float bearing = 7;                         // degrees clockwise from true north
  float speed_meters_per_second = 8;
  VehicleStatus status = 9;
  string stop_id = 10;
  google.protobuf.Timestamp observed_at = 11; // when the agency recorded this position
  // Added after v1 was published, as a new field number: old clients simply ignore it.
  // "optional" because 0 is a real direction: without it, "direction 0" and "unknown" would look the same.
  optional int32 direction_id = 12;
}

// Response of GET /api/transit/vehicles.
message VehicleList {
  google.protobuf.Timestamp feed_timestamp = 1; // when the upstream feed was generated
  int32 total_in_feed = 2;                      // vehicles in the feed before filtering
  repeated Vehicle vehicles = 3;
}
