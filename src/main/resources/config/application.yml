# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# https://docs.spring.io/spring-boot/appendix/application-properties/index.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - logfile
          - loggers
          - metrics
          - prometheus
          - threaddump
          - caches
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  info:
    git:
      mode: full
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  # Prometheus (above) is always available: it is what the CloudWatch-export Lambda scrapes.
  # Other exporters are on the classpath but OFF by default (their defaults are "enabled").
  # Turn one on per environment with a Spring profile:
  #   dynatrace -> application-dynatrace.yml  metrics to the local Dynatrace OneAgent (OneAgent also traces)
  #   datadog   -> application-datadog.yml    metrics, pushed to the Datadog API
  # Log shipping profiles (configured in logback-spring.xml):
  #   splunk    -> Splunk HTTP Event Collector (SPLUNK_HEC_URL, SPLUNK_HEC_TOKEN)
  #   fluentd   -> Fluentd / Doppler forward protocol (FLUENTD_HOST, FLUENTD_PORT)
  #   json-logs -> JSON console logs (active in prod)
  datadog:
    metrics:
      export:
        enabled: false
  dynatrace:
    metrics:
      export:
        enabled: false
  observations:
    annotations:
      enabled: true # enables @Observed on beans (timers), see MbtaService, TransitService, RouteBoardService
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true
    tags:
      application: ${spring.application.name}
      env: ${DEPLOY_ENV:local}

spring:
  application:
    name: voicebioApi
  http:
    clients:
      imperative:
        factory: jdk # JDK HttpClient: supports PATCH (the "simple" HttpURLConnection factory does not)
    serviceclient:
      mbta: # HTTP interface group "mbta" (see MbtaV3Client): MBTA V3 REST API, JSON:API
        base-url: https://api-v3.mbta.com
        connect-timeout: 5s
        read-timeout: 10s
      transit: # HTTP interface group "transit" (see GtfsRealtimeClient): GTFS-Realtime feed, protobuf over HTTP
        base-url: https://cdn.mbta.com
        connect-timeout: 5s
        read-timeout: 10s
  threads:
    virtual:
      enabled: true # Java 21 virtual threads: blocking HTTP calls no longer pin a platform thread
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: '@spring.profiles.active@'
    group:
      dev:
        - secret-samples
        - api-docs
      prod:
        - json-logs # machine-readable console output (stdout is also read by OneAgent and the platform)
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth
  task:
    execution:
      thread-name-prefix: voicebio-api-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: voicebio-api-scheduling-
      pool:
        size: 2
  output:
    ansi:
      console-available: true

# Console logs are human-readable text by default; the "json-logs" profile (active in prod) switches them to JSON.

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# ===================================================================
# Application specific properties (bound to the ApplicationProperties class)
# ===================================================================

application:
  mbta:
    api-key: ${MBTA_API_KEY:} # optional; without a key MBTA allows 20 requests/minute, with one 1000
  api-docs:
    title: Voicebio API
    description: Voicebio API documentation
    version: 0.0.1
